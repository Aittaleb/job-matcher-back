spring.application.name=recherche-offre-api

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Import Vault config if available; app still starts when Vault is absent.
spring.cloud.vault.enabled=true
spring.config.import=optional:vault://

# Vault connection
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=dev-root-token

# KV v2 defaults
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=${spring.application.name}
spring.cloud.vault.kv.application-name=${spring.application.name}

# API
api.france-travail.auth.base-url=https://entreprise.francetravail.fr

offre-emploi.api.base-url=https://api.francetravail.io
offre-emploi.api.scope=api_offresdemploiv2 o2dsoffre
offre-emploi.api.auth-cache-ttl-seconds=1499
