spring.application.name=recherche-offre-api

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# KV v2 defaults
api.offredemploi.client_id=offre-emploi-api-client-id
api.offredemploi.client_secret=offre-emploi-api-client-secret

# API
api.france-travail.auth.base-url=http://localhost

offre-emploi.api.base-url=http://localhost
offre-emploi.api.scope=api_offresdemploiv2 o2dsoffre nomenclatureRome api_rome-competencesv1
offre-emploi.api.auth-cache-ttl-seconds=1499
offre-emploi.api.rome-cache-ttl-hours=24

## flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:flyway/versions/